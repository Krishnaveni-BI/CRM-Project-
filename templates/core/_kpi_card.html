<div class="col-6 col-md-2">
  <div class="stat-card text-center" style="border-top:4px solid {{ color }}; min-height:105px; display:flex; flex-direction:column; justify-content:center; padding:.8rem;">
    <div style="font-size:1.9rem; font-weight:700; color:{{ color }}; line-height:1.1">{{ value }}</div>
    <div class="fw-semibold mt-1" style="font-size:.78rem; color:#374151; line-height:1.3">{{ label }}</div>
    <div style="font-size:.7rem;color:#9ca3af;margin-top:.2rem">{{ sub }}</div>
  </div>
</div>
