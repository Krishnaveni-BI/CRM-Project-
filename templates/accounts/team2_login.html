<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team 2 Login — Farmer CRM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #134e4a 0%, #0d9488 60%, #2dd4bf 100%);
      display: flex; align-items: center; justify-content: center; padding: 1rem;
    }
    .login-card {
      background: #fff; border-radius: 20px; padding: 2.5rem 2rem;
      width: 100%; max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    .logo-circle {
      width: 72px; height: 72px; border-radius: 50%;
      background: linear-gradient(135deg, #134e4a, #2dd4bf);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; color: #fff; margin: 0 auto 1rem;
    }
    .form-control-lg { border-radius: 10px; border: 1.5px solid #d1d5db; }
    .form-control-lg:focus { border-color: #0d9488; box-shadow: 0 0 0 3px rgba(13,148,136,.15); }
    .btn-login {
      background: #134e4a; color: #fff; border: none;
      padding: .75rem; font-size: 1rem; border-radius: 10px;
      width: 100%; font-weight: 700;
    }
    .btn-login:hover { background: #0d9488; color: #fff; }
    .back-link { color: rgba(255,255,255,.85); text-decoration: none; font-size: .85rem; display: block; text-align: center; margin-top: 1.25rem; }
    .back-link:hover { color: #fff; }
  </style>
</head>
<body>

  <div>
    <div class="login-card">
      <div class="text-center mb-4">
        <div class="logo-circle"><i class="bi bi-chat-dots-fill"></i></div>
        <h4 class="fw-bold mb-1" style="color:#134e4a">Team 2 — Follow-up Login</h4>
        <p class="text-muted mb-0" style="font-size:.83rem">Login to view your follow-up farmers</p>
      </div>

      {% if messages %}
        {% for message in messages %}
        <div class="alert alert-danger py-2 mb-3" style="font-size:.84rem">{{ message }}</div>
        {% endfor %}
      {% endif %}

      <form method="post" autocomplete="off">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold" style="font-size:.85rem">Username</label>
          <input type="text" name="username" class="form-control form-control-lg" placeholder="Enter your username" autofocus required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold" style="font-size:.85rem">Password</label>
          <input type="password" name="password" class="form-control form-control-lg" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-login">
          <i class="bi bi-box-arrow-in-right me-2"></i>Login to My Follow-ups
        </button>
      </form>
    </div>

    <a href="{% url 'login' %}" class="back-link">
      <i class="bi bi-arrow-left me-1"></i>Back to Main Login
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
